# PR Gate — dsh-mobile-apk: static scan + Kotlin compile gate + PR spec checks
# Release gating still lives in the local build-release.ps1; this only blocks low-level errors and spec issues.
name: PR Gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  static:
    name: 冲突标记与敏感信息扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 冲突标记检查
        run: |
          if grep -rEn '^(<<<<<<< |>>>>>>> )' app/src --include='*.kt' --include='*.java' --include='*.xml' --include='*.html' --include='*.js' --include='*.yml' --include='*.yaml'; then
            echo "::error::检测到未解决的 merge conflict 标记"
            exit 1
          fi
          echo "无冲突标记 ✓"
      - name: 敏感信息扫描
        run: |
          if grep -rEn '(sk-[A-Za-z0-9]{16,}|ghp_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|xox[baprs]-[A-Za-z0-9-]{10,})' app/src scripts 2>/dev/null; then
            echo "::error::检测到疑似密钥/令牌"
            exit 1
          fi
          echo "无敏感信息 ✓"
      # 镜像对端（协调仓 = 补丁权威源）：FX-208.2 去掉自包含比对开关——它跳过跨仓比对，
      # 单边演进的补丁 PR 会照绿。改为显式检出协调仓并做逐字节跨仓比对。
      #
      # review C7 修正（0.14.0 CI/CD 修复 C-2）：协调仓是私有库，必须用 PAT；但此前写的是
      # `COORD_REPO_TOKEN`，本仓 secrets 里**并不存在**该名（只有 `GH_PAT`）——结果检出步骤
      # 直接报 `##[error]Input required and not supplied: token`，整个 static job 在检出即失败，
      # 其后 14 道门禁**全部 skipped**（不是"跑了但没过"，是"从未执行"）。
      # 现改用本仓既有的 `GH_PAT`（build-snapshot.yml 已用它跨仓检出协调仓，实测有效），
      # 并加显式非空断言：密名再被改坏时硬失败且给出可操作错误，不再静默消失。
      #
      # ref 解析策略：迭代分支在场则用、缺席回退 main（与协调仓 CI 同一约定）——迭代期为
      # 配对分支、三仓合并删分支后自动回退 main，两种状态都正确且不需要复位提交。
      # 检出步骤禁止 continue-on-error（软化 = 防线静默消失）；--require-peer 让对端缺席直接判红。
      - name: 检出镜像对端（协调仓，私有库经 PAT）
        env:
          COORD_PAT: ${{ secrets.GH_PAT }}
          ITERATION_BRANCH_COORD: feat/0140-preview-engine
        run: |
          set -e
          if [ -z "${COORD_PAT}" ]; then
            echo "::error::缺 GH_PAT secret——协调仓是私有库，无 PAT 无法跨仓检出；镜像防线会静默消失，故硬失败"
            exit 1
          fi
          url="https://x-access-token:${COORD_PAT}@github.com/kelai141/dsh-mobile.git"
          # 先证鉴权可用（否则一切"找不到分支"的结论都不可信）。
          if ! git ls-remote --heads "${url}" >/dev/null 2>&1; then
            echo "::error::GH_PAT 无法读取协调仓——PAT 缺失/过期/权限不足。镜像防线不能用回退掩盖，硬失败"
            exit 1
          fi
          ref="${ITERATION_BRANCH_COORD}"
          # 精确区分两种"非 0"：exit 2 = 确实没有该分支（迭代结束、分支已删）→ 合法回退 main；
          # 其余（网络/鉴权/其他）不得回退——否则会**静默**拿 main 去比对迭代分支，得到一片假红。
          git ls-remote --exit-code --heads "${url}" "${ref}" >/dev/null 2>&1
          probe=$?
          if [ "$probe" -eq 2 ]; then
            echo "提示: 迭代分支 ${ref} 不存在（已合并/已删）——回退 main"
            ref="main"
          elif [ "$probe" -ne 0 ]; then
            echo "::error::探测分支 ${ref} 失败（exit=${probe}，非分支不存在语义）——不回退，硬失败以免假红"
            exit 1
          fi
          git clone --quiet --depth 1 --branch "${ref}" "${url}" peer-coord
          echo "镜像对端: kelai141/dsh-mobile -> peer-coord（ref=${ref}）"
          [ -f peer-coord/scripts/patches/registry.json ] || { echo "::error::对端检出内容不完整（缺 registry.json）"; exit 1; }
      # 补丁镜像面跨仓一致性 + 引擎树补丁行为回归
      - name: 补丁一致性门禁与回归
        run: |
          node scripts/check-patch-mirror.mjs --peer peer-coord --require-peer
          node scripts/patches/tests/spj-migration-link-f5.test.mjs
          node scripts/patches/tests/atomic-stale-lock.test.mjs
          node scripts/patches/tests/publish-exclusive-reclaim.test.mjs
      # 控制协议 V2（0.13.8 批 F）：引擎侧编解码的往返等价与体积基线（壳侧 Kotlin 一侧由
      # 本仓单测 + 跨语言往返门禁另守）。
      - name: 协议 V2 往返与体积门禁
        run: |
          (cd plugins/dsh-android-manage && npm install --no-audit --no-fund && npm run build)
          node scripts/check-protocol-v2.mjs
      # 工具返回值 vs output.schema 运行时契约门禁（0.13.8-b 批 B2 T2 / E-10）
      - name: 工具输出 schema 契约门禁
        run: |
          (cd plugins/dsh-android-manage && npm install --no-audit --no-fund && npm run build)
          node scripts/check-tool-output-schema.mjs
      - name: 控制 op 登记链门禁
        run: node scripts/check-control-ops.mjs
      # 壳侧加固语义（NSC / backup 规则 / exported）与子进程有界读（0.13.8-b FX-208.4 / E1）
      - name: 壳侧加固与有界读门禁
        run: |
          node scripts/check-manifest-hardening.mjs
          node scripts/check-bounded-io.mjs
          node scripts/check-api-route-auth.mjs
      # 快照指纹对账（ST-04）：净检出下 tar 被 .gitignore 忽略 → SKIP 计数（构建链以 --require 严格跑）
      - name: 快照指纹对账门禁
        run: node scripts/check-snapshot-fingerprint.mjs
      # 接线面聚合断言（0.13.8-b FX-208.2/E2）：本仓布局下解析到同名相对路径
      - name: 门禁接线面聚合断言
        run: node scripts/check-release-gates.mjs
      # 制度性门禁（0.13.8-b 批 B2 ST-25/26/31）：状态登记制 / 桥面对称性 / 门禁覆盖与 SKIP 纪律。
      # 三者离线可跑（不依赖快照），故在 CI 与两条构建链同源；性能度量入口在无快照时计数 SKIP。
      - name: 制度性门禁（登记制 / 桥面对称 / SKIP 纪律）
        run: |
          node scripts/check-state-registry.mjs
          node scripts/check-bridge-symmetry.mjs
          node scripts/check-gate-skips.mjs
          node scripts/check-kotlin-comments.mjs
          node scripts/check-build-chain-abort.mjs
          node scripts/check-perf-instrumentation.mjs
      # 模型面工具 wire 预算（0.14.0 §4.1 渐进披露）：双口径；名单从 capability-gate 导出。
      # 需先构建七个模型面插件的 lib（门禁真跑 apply()），缺产物时门禁明确拒绝而非假绿。
      - name: 模型面工具 wire 预算门禁
        run: |
          for d in plugins/dsh-android-bridge plugins/dsh-android-manage plugins/dsh-android-linux-env plugins/dsh-android-file-open plugins/dsh-android-browser plugins/dsh-android-vdisplay plugins/dsh-model-capability; do
            (cd "$d" && npm install --no-audit --no-fund && npm run build)
          done
          node scripts/check-tool-surface-budget.mjs

  compile:
    name: Kotlin 编译门禁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Gradle cache acceleration: dependency/build caches reused across runs (full on first, incremental after)
      - uses: gradle/actions/setup-gradle@v4
      - name: 确保 Android SDK platform 36
        run: |
          yes | sudo "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" >/dev/null 2>&1 || true
      - name: 编译 debug Kotlin（compileDebugKotlin，不依赖快照资产）
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin --no-daemon --stacktrace